services:
  - type: web
    name: lumexa-electronics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false          # set this in the Render dashboard, don't commit it
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: AGENT_TURN_MAX_TOKENS
        value: "2000"
